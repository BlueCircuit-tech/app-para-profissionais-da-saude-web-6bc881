<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumine Face — Plataforma Clínica de HOF & Cirurgia da Face</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          onix: '#0A0A0A',
          onix2: '#121212',
          onix3: '#1A1A1A',
          onix4: '#242424',
          ouro: '#D4AF37',
          ouro2: '#E8CC70',
          ouro3: '#8A7124',
          neve: '#FAFAFA',
          cinza: '#9A9A96'
        },
        fontFamily: {
          display: ['"Cormorant Garamond"', 'serif'],
          sans: ['Jost', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  html { scroll-behavior: smooth; }
  body { background-color:#0A0A0A; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: #121212; }
  ::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

  .nav-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    padding: .65rem .9rem;
    border-radius: .5rem;
    color: #9A9A96;
    font-size: .875rem;
    letter-spacing: .02em;
    transition: all .18s ease;
    border: 1px solid transparent;
    text-align: left;
  }
  .nav-item:hover { color: #FAFAFA; background: #1A1A1A; }
  .nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; }
  .nav-item.ativo {
    color: #0A0A0A;
    background: linear-gradient(100deg, #D4AF37 0%, #E8CC70 100%);
    border-color: #E8CC70;
    font-weight: 600;
    box-shadow: 0 6px 18px -8px rgba(212,175,55,.75);
  }
  .nav-item.ativo::before {
    content:"";
    position:absolute; left:-14px; top:50%; transform:translateY(-50%);
    width:4px; height:22px; border-radius:4px; background:#D4AF37;
  }
  .borda-ouro { border:1px solid rgba(212,175,55,.22); }
  .filete { height:1px; background:linear-gradient(90deg,rgba(212,175,55,0),rgba(212,175,55,.55),rgba(212,175,55,0)); }
</style>
</head>
<body class="bg-onix text-neve font-sans antialiased">

<div class="flex min-h-screen">

  <!-- ===== MENU LATERAL ===== -->
  <aside class="w-[266px] shrink-0 bg-onix2 border-r border-white/5 flex flex-col fixed h-screen z-30">

    <div class="px-6 pt-7 pb-5">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-lg border border-ouro/50 flex items-center justify-center bg-onix">
          <span class="font-display text-2xl font-semibold text-ouro leading-none">L</span>
        </div>
        <div class="leading-tight">
          <p class="font-display text-2xl text-neve font-semibold tracking-wide">Lumine<span class="text-ouro">Face</span></p>
          <p class="text-[10px] uppercase tracking-[.22em] text-cinza">HOF &amp; Cirurgia Facial</p>
        </div>
      </div>
    </div>

    <div class="filete mx-6 mb-5"></div>

    <nav class="px-5 flex-1 overflow-y-auto space-y-1 pb-6">
      <p class="text-[10px] uppercase tracking-[.2em] text-cinza/60 px-3 mb-2">Clínica</p>

      <button data-nav="painel-do-profissional" onclick="mostrarTela('painel-do-profissional')" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Painel do Profissional
      </button>

      <button data-nav="agenda-de-consultas" onclick="mostrarTela('agenda-de-consultas')" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        Agenda de Consultas
      </button>

      <button data-nav="ficha-do-paciente" onclick="mostrarTela('ficha-do-paciente')" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16l7-3 7 3z"/><path d="M12 7v6M9 10h6"/></svg>
        Ficha do Paciente
      </button>

      <button data-nav="evolucao-em-fotos" onclick="mostrarTela('evolucao-em-fotos')" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Evolução em Fotos
      </button>

      <p class="text-[10px] uppercase tracking-[.2em] text-cinza/60 px-3 mb-2 pt-5">Comercial</p>

      <button data-nav="orcamento-e-pagamento" onclick="mostrarTela('orcamento-e-pagamento')" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Orçamento e Pagamento
      </button>

      <button data-nav="funil-de-leads" onclick="mostrarTela('funil-de-leads')" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v7l-4 2v-9z"/></svg>
        Funil de Leads
      </button>
    </nav>

    <div class="px-5 pb-5">
      <div class="filete mb-4"></div>
      <button onclick="mostrarTela('ficha-do-paciente')" class="w-full flex items-center gap-3 p-3 rounded-lg bg-onix3 borda-ouro hover:border-ouro/60 transition text-left">
        <img src="https://i.pravatar.cc/80?img=47" alt="Dra. Marina Rebouças" class="w-9 h-9 rounded-full object-cover border border-ouro/40">
        <div class="min-w-0">
          <p class="text-sm text-neve truncate">Dra. Marina Rebouças</p>
          <p class="text-[11px] text-ouro/80 truncate">CRM-SP 148.302 · Perfil Equipe</p>
        </div>
      </button>
    </div>
  </aside>

  <!-- ===== CONTEÚDO ===== -->
  <div class="flex-1 ml-[266px] flex flex-col min-h-screen">

    <header class="sticky top-0 z-20 bg-onix2/95 backdrop-blur border-b border-white/5">
      <div class="h-16 px-8 flex items-center justify-between gap-6">
        <div class="flex items-center gap-3 text-sm text-cinza">
          <span class="w-2 h-2 rounded-full bg-ouro"></span>
          <span>Clínica Lumine — Rua Haddock Lobo, 1.412 · Jardins, São Paulo/SP</span>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="mostrarTela('funil-de-leads')" class="hidden lg:flex items-center gap-2 text-xs uppercase tracking-[.14em] text-cinza hover:text-ouro transition border border-white/10 hover:border-ouro/50 rounded-full px-4 py-2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="w-4 h-4"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 20.5l1.6-4.9A8.4 8.4 0 1 1 21 11.5z"/></svg>
            3 leads no WhatsApp
          </button>
          <button onclick="mostrarTela('agenda-de-consultas')" class="relative w-10 h-10 rounded-full bg-onix3 border border-white/10 hover:border-ouro/50 flex items-center justify-center text-cinza hover:text-ouro transition">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="w-5 h-5"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-ouro text-onix text-[10px] font-semibold flex items-center justify-center">5</span>
          </button>
          <button onclick="mostrarTela('orcamento-e-pagamento')" class="bg-ouro text-onix text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-ouro2 transition">
            Novo orçamento
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 px-8 py-8">
<!-- TELAS -->
    </main>

    <footer class="px-8 py-5 border-t border-white/5 text-[11px] text-cinza/70 flex items-center justify-between">
      <span>LumineFace · Protótipo navegável — dados fictícios para demonstração</span>
      <span class="text-ouro/70 tracking-[.18em] uppercase">BlueCircuit</span>
    </footer>
  </div>
</div>

<script>
  function mostrarTela(id) {
    document.querySelectorAll('[data-tela]').forEach(function (s) {
      s.classList.toggle('hidden', s.dataset.tela !== id);
    });
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      b.classList.toggle('ativo', b.dataset.nav === id);
    });
    window.scrollTo({ top: 0 });
  }
  document.addEventListener('DOMContentLoaded', function () {
    mostrarTela('painel-do-profissional');
  });
</script>
</body>
</html>
